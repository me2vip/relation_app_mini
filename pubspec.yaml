name: relation_app_mini
description: "社交塔子 - 智能社交搭子助手"
publish_to: 'none'
# 版本号唯一来源：x.y.z+build（+后为 Android versionCode），
# 改一处 → gradle 自动同步（flutter.versionCode / flutter.versionName）
version: 1.17.0+42

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # 状态管理
  provider: ^6.1.2
  
  # PDF导出和打印
  printing: ^5.14.2
  pdf: ^3.11.1
  
  # 文件路径
  path_provider: ^2.1.5
  
  # 分享
  share_plus: ^10.1.1
  
  # 版本信息
  package_info_plus: ^8.0.2
  
  # 网络请求
  dio: ^5.7.0
  
  # 文件打开
  open_filex: ^4.5.0
  
  # 本地存储
  sqflite: ^2.4.2
  shared_preferences: ^2.3.5
  
  # 通知提醒
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # 生物识别
  local_auth: ^2.3.0
  
  # 图片选择
  image_picker: ^1.1.2
  
  # 文件选择
  file_picker: ^8.1.7
  
  # 权限
  permission_handler: ^11.3.1
  
  # UUID
  uuid: ^4.5.1
  
  # 日期时间
  intl: ^0.20.2

  # Markdown 渲染
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/pdf/

flutter_launcher_icons:
  android: true
  image_path_android: "assets/icons/app_icon.png"
  adaptive_icon_background: "#EAF2FB"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  min_sdk_android: 21
